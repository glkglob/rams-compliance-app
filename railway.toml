# =============================================================================
# Railway Configuration - Image-based Deployment (Recommended)
# =============================================================================
# We now deploy pre-built Docker images from Docker Hub instead of building
# the Dockerfile on every deploy. This is faster and more consistent.
#
# Image: k1dev2026/rams-compliance-app:latest  (or pin to a sha tag for prod)
#
# To switch:
#   1. Go to your Railway service → Settings → Source
#   2. Change from GitHub to "Deploy from Image"
#   3. Enter: k1dev2026/rams-compliance-app:latest
#
# The [build] section below is kept for reference/fallback only.
# =============================================================================

[build]
# Disabled for normal deployments (we deploy from Docker Hub image)
# builder = "DOCKERFILE"
# dockerfilePath = "Dockerfile"

[deploy]
runtime = "V2"
numReplicas = 1

# With Next.js standalone output, the entrypoint is server.js
startCommand = "node server.js"

healthcheckPath = "/api/health"
healthcheckTimeout = 45
healthcheckGracePeriod = 20

sleepApplication = false
useLegacyStacker = false
ipv6EgressEnabled = false
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
