# =============================================================================
# Railway Configuration - Image-based Deployment (Recommended)
# =============================================================================
# This project deploys pre-built images from Docker Hub for speed, consistency,
# and lower build costs on Railway.
#
# Image: k1dev2026/rams-compliance-app:latest
#         (or use a sha tag like k1dev2026/rams-compliance-app:sha-abc123 for prod)
#
# How to enable / switch:
#   1. In Railway dashboard → Your Service → Settings → Source
#   2. Select "Deploy from Image"
#   3. Enter: k1dev2026/rams-compliance-app:latest
#
# After the first switch, new pushes of the same tag (or sha tags) will deploy.
# =============================================================================

[deploy]
runtime = "V2"
numReplicas = 1

# Next.js standalone output → server.js at the root of the standalone bundle
startCommand = "node server.js"

# Healthcheck — the /api/health route is hardened to always return 200
# (returns "degraded" in body on non-critical failures to avoid aggressive restarts)
healthcheckPath = "/api/health"
healthcheckTimeout = 30
healthcheckGracePeriod = 30

# Reliability settings
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

sleepApplication = false
useLegacyStacker = false
ipv6EgressEnabled = false
