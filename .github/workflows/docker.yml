name: Build and Deploy

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'k1dev2026' }}
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || 'k1dev2026' }}/rams-compliance-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image (using native action for rich tagging)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: Dockerfile
          platforms: linux/amd64

      - name: Image digest
        if: github.event_name != 'pull_request'
        run: |
          echo "Pushed image digest: ${{ steps.build.outputs.digest }}"
          echo "image_digest=${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Deploy to Railway (only on main + manual, not PRs)
  # Deploys using the Railway service configuration (expected to be set to
  # pull the latest image from Docker Hub). Requires RAILWAY_TOKEN.
  # ---------------------------------------------------------------------------
  deploy-railway:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        shell: bash
        env:
          RAILWAY_CLI_VERSION: v3.17.0
        run: |
          set -euo pipefail
          echo "Installing Railway CLI version ${RAILWAY_CLI_VERSION}..."

          # Download specific version for better reliability (avoids flakiness of install script)
          curl -sSL -o /tmp/railway.tar.gz \
            "https://github.com/railwayapp/cli/releases/download/${RAILWAY_CLI_VERSION}/railway_${RAILWAY_CLI_VERSION#v}_linux_amd64.tar.gz"

          mkdir -p "$HOME/.railway/bin"
          tar -xzf /tmp/railway.tar.gz -C "$HOME/.railway/bin" --strip-components=1
          chmod +x "$HOME/.railway/bin/railway"

          echo "$HOME/.railway/bin" >> $GITHUB_PATH
          echo "Railway CLI installed:"
          "$HOME/.railway/bin/railway" --version

      - name: Deploy to Railway
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_DIGEST="${{ needs.build-and-push.outputs.digest }}"
          IMAGE_REF="${{ env.IMAGE_NAME }}:latest"

          echo "=== Railway Deployment ==="
          echo "Image: $IMAGE_REF"
          echo "Digest: $IMAGE_DIGEST"
          echo "============================="

          if [ -n "$IMAGE_DIGEST" ]; then
            echo "Deploying image with digest: $IMAGE_DIGEST"
          fi

          # Retry logic for transient failures (network, Railway API hiccups, etc.)
          MAX_RETRIES=3
          RETRY_DELAY=10

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $attempt of $MAX_RETRIES: Running railway deploy..."

            if railway deploy --detach; then
              echo "✅ Railway deploy succeeded on attempt $attempt"
              exit 0
            fi

            echo "❌ Railway deploy failed on attempt $attempt"

            if [ $attempt -lt $MAX_RETRIES ]; then
              echo "Waiting ${RETRY_DELAY}s before retry..."
              sleep $RETRY_DELAY
              RETRY_DELAY=$((RETRY_DELAY * 2))  # exponential backoff
            fi
          done

          echo "::error::Railway deploy failed after $MAX_RETRIES attempts"
          exit 1
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
