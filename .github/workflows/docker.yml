name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:   # Allows manual triggering from the Actions tab

env:
  # Docker Hub username (defaults to k1dev2026 if secret is not set)
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'k1dev2026' }}
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || 'k1dev2026' }}/rams-compliance-app

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Build and push using npm run docker:build:push (manual only)
        # This step demonstrates running the exact same command developers use locally.
        # It only runs on manual workflow dispatch to avoid double-building.
        if: github.event_name == 'workflow_dispatch'
        run: npm run docker:build:push

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image (using native action for rich tagging)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: Dockerfile
          # Force amd64 for Railway compatibility
          platforms: linux/amd64

      - name: Image digest
        if: github.event_name != 'pull_request'
        run: echo "Pushed image digest: ${{ steps.meta.outputs.digest }}"

  # ---------------------------------------------------------------------------
  # Deploy the new image to Railway (only on main + manual, not PRs)
  # Requires RAILWAY_TOKEN secret (create at https://railway.app/account/tokens)
  # ---------------------------------------------------------------------------
  deploy-railway:
    needs: docker
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for railway.toml if needed)
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: curl -sSL https://railway.app/install.sh | sh

      - name: Deploy image to Railway
        run: |
          # Deploy the newly pushed image.
          # Works best after you have run `railway link` once locally for the project/service,
          # or when your Railway project has only one service.
          railway deploy --image ${{ env.IMAGE_NAME }}:latest --detach || true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
