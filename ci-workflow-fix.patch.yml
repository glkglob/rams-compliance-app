# =============================================================================
# FIXED .github/workflows/docker.yml
# =============================================================================
# Apply this file by copying it to .github/workflows/docker.yml
# (Devin cannot push workflow files — requires the `workflow` OAuth scope)
#
# Fixes:
#  1. Resolved merge-conflict markers
#  2. Added build-args for NEXT_PUBLIC_* vars (root cause of dead-after-loading)
#  3. Fixed deploy-railway `needs:` to reference correct job name
#  4. Added verify job (lint + type-check + test) gating the build
# =============================================================================
name: Build and Deploy

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'k1dev2026' }}
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || 'k1dev2026' }}/rams-compliance-app

jobs:
  # ---------------------------------------------------------------------------
  # Quality gate: lint, type-check, unit tests
  # ---------------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx eslint .
      - run: npx tsc --noEmit
      - run: npm test -- --run

  # ---------------------------------------------------------------------------
  # Docker build + push (only on main / tags / manual — not PRs)
  # ---------------------------------------------------------------------------
  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: Dockerfile
          platforms: linux/amd64
          # CRITICAL: NEXT_PUBLIC_* vars are inlined into the client bundle at
          # build time. Without these, the app dies after the loading screen.
          # These are public by design (browser-safe, protected by RLS).
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}

      - name: Image digest
        run: |
          echo "Pushed image digest: ${{ steps.build.outputs.digest }}"
          echo "image_digest=${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Deploy to Railway (only on main + manual, not PRs)
  # ---------------------------------------------------------------------------
  deploy-railway:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        shell: bash
        env:
          RAILWAY_CLI_VERSION: v3.17.0
        run: |
          set -euo pipefail
          echo "Installing Railway CLI version ${RAILWAY_CLI_VERSION}..."
          curl -sSL -o /tmp/railway.tar.gz \
            "https://github.com/railwayapp/cli/releases/download/${RAILWAY_CLI_VERSION}/railway_${RAILWAY_CLI_VERSION#v}_linux_amd64.tar.gz"
          mkdir -p "$HOME/.railway/bin"
          tar -xzf /tmp/railway.tar.gz -C "$HOME/.railway/bin" --strip-components=1
          chmod +x "$HOME/.railway/bin/railway"
          echo "$HOME/.railway/bin" >> $GITHUB_PATH
          echo "Railway CLI installed:"
          "$HOME/.railway/bin/railway" --version

      - name: Deploy to Railway
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_DIGEST="${{ needs.build-and-push.outputs.digest }}"
          IMAGE_REF="${{ env.IMAGE_NAME }}:latest"

          echo "=== Railway Deployment ==="
          echo "Image: $IMAGE_REF"
          echo "Digest: $IMAGE_DIGEST"
          echo "============================="

          MAX_RETRIES=3
          RETRY_DELAY=10

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $attempt of $MAX_RETRIES: Running railway deploy..."
            if railway deploy --detach; then
              echo "Railway deploy succeeded on attempt $attempt"
              exit 0
            fi
            echo "Railway deploy failed on attempt $attempt"
            if [ $attempt -lt $MAX_RETRIES ]; then
              echo "Waiting ${RETRY_DELAY}s before retry..."
              sleep $RETRY_DELAY
              RETRY_DELAY=$((RETRY_DELAY * 2))
            fi
          done

          echo "::error::Railway deploy failed after $MAX_RETRIES attempts"
          exit 1
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
